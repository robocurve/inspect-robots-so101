name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint + strict typing, once. mypy targets the 3.11 floor via pyproject; running
  # it on 3.11 avoids NumPy's 3.12-only stub syntax.
  quality:
    name: lint · type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install from uv.lock (dev extras)
        run: uv sync --locked --python 3.11 --extra dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy

  # Blocking test gate across the supported OS x Python matrix (100% coverage).
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install from uv.lock (dev extras)
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev
      - name: Pytest (100% coverage)
        run: uv run pytest --cov --cov-report=term-missing

  # Real-import guard for the lazily-imported lerobot seam. The unit tests fake
  # these modules (sys.modules), so only this job catches upstream drift in the
  # import paths / symbols the seam code relies on (lerobot.policies.factory,
  # lerobot feature_utils, the SO follower driver), and it is the only place the
  # torch-only obs-prep port (_raw_to_policy_observation) actually runs.
  # lerobot needs Python >= 3.12; UV_TORCH_BACKEND=cpu avoids the multi-GB CUDA torch.
  lerobot-seam:
    name: lerobot seam imports (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Create venv (py3.12)
        run: uv venv --python 3.12
      - name: Install with lerobot extra (CPU torch)
        env:
          UV_TORCH_BACKEND: cpu
        run: uv pip install -e ".[dev,lerobot]"
      - name: Import every seam symbol against the real lerobot
        run: |
          uv run python - <<'PY'
          # Exactly the imports the lazy seams perform at runtime.
          from types import SimpleNamespace

          import numpy as np
          import torch

          from lerobot.policies.factory import get_policy_class, make_pre_post_processors
          from lerobot.robots.so_follower import SOFollower
          from lerobot.robots.so_follower.config_so_follower import SOFollowerRobotConfig

          from inspect_robots_so101 import packing
          from inspect_robots_so101.config import LeRobotPolicyConfig, SOArmConfig
          from inspect_robots_so101.policy import (
              _hw_observation_features,
              _import_feature_utils,
              _raw_to_policy_observation,
          )

          # The version-tolerant import must resolve against the installed lerobot.
          hw_to_dataset_features, build_dataset_frame = _import_feature_utils()

          # Construct the config objects the seams construct (no hardware touched).
          policy_cfg = LeRobotPolicyConfig()
          arm_cfg = SOArmConfig()
          robot_cfg = SOFollowerRobotConfig(port=arm_cfg.port)
          features = hw_to_dataset_features(
              _hw_observation_features(policy_cfg), "observation", use_video=False
          )
          assert "observation.state" in features, features

          # Build the driver without connect(): the motor bus constructor resolves
          # each motor model (lerobot >= 0.7: via rustypot), so a missing backend or
          # an unknown sts3215 fails here with no hardware.
          robot = SOFollower(SOFollowerRobotConfig(port="/dev/null"))

          # Run the obs-prep port against real torch, for uint8 and float32 frames.
          h, w = policy_cfg.cam_height, policy_cfg.cam_width
          img_feats = {
              f"observation.images.{cam}": SimpleNamespace(shape=(3, 224, 224))
              for cam in policy_cfg.cameras
          }
          for dtype in (np.uint8, np.float32):
              raw = {key: float(i) for i, key in enumerate(packing.motor_keys())}
              for cam in policy_cfg.cameras:
                  frame = np.random.default_rng(0).integers(0, 256, (h, w, 3))
                  raw[cam] = frame.astype(dtype) if dtype is np.uint8 else frame.astype(dtype) / 255
              raw["task"] = "pick"
              obs = _raw_to_policy_observation(raw, features, img_feats, build_dataset_frame)
              assert obs["observation.state"].shape == (1, len(packing.motor_keys())), obs
              assert obs["observation.state"].tolist()[0] == list(range(6)), obs
              for key in img_feats:
                  img = obs[key]
                  assert img.shape == (1, 3, 224, 224), (key, img.shape)
                  assert img.dtype == torch.float32, img.dtype
                  assert 0.0 <= float(img.min()) and float(img.max()) <= 1.0
                  assert img.is_contiguous()
              assert obs["task"] == "pick"
              assert set(obs) == {"observation.state", "task", *img_feats}, set(obs)

          print("lerobot seam OK:", torch.__version__)
          print("  get_policy_class:", get_policy_class)
          print("  make_pre_post_processors:", make_pre_post_processors)
          print("  hw_to_dataset_features:", hw_to_dataset_features)
          print("  build_dataset_frame:", build_dataset_frame)
          print("  SOFollower:", type(robot).__name__, "| bus:", type(robot.bus).__name__)
          PY

  # Dependency hygiene: the package must import with ONLY its runtime deps
  # (inspect-robots + numpy) — no torch or lerobot (those are lazy `lerobot` extras).
  import-hygiene:
    name: import without lerobot/hardware extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install runtime only from uv.lock (no extras)
        run: uv sync --locked --python 3.12
      - name: Assert optional deps absent, then import
        run: |
          uv run python - <<'PY'
          import importlib.util
          for mod in ("torch", "lerobot"):
              assert importlib.util.find_spec(mod) is None, f"{mod} unexpectedly installed"
          import inspect_robots_so101
          print("inspect_robots_so101", inspect_robots_so101.__version__, "imported with runtime deps only")
          PY

  # Single required status check for branch protection: green iff every job
  # above is green. Add new jobs to 'needs' here or they won't gate merges.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [quality, test, lerobot-seam, import-hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  # Red main is a stop-the-line event: open an issue so it can't go unnoticed.
  # Only fires on pushes (i.e. merges to main), never on PR runs.
  alert-red-main:
    name: alert on red main
    if: ${{ failure() && github.event_name == 'push' }}
    needs: [quality, test, lerobot-seam, import-hygiene]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "CI is red on main in:title" --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY"               --title "CI is red on main (${GITHUB_SHA:0:8})"               --body "CI failed on a push to main: $RUN_URL — stop-the-line: fix forward or revert before merging anything else. If the failure is transient (network, external deps), re-run the failed jobs and close this."
          else
            echo "an open red-main issue already exists; not filing another"
          fi
